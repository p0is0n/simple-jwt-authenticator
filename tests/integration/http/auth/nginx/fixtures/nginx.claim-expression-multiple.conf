upstream authenticator_backend {
    server authenticator:8080;
}

upstream protected_backend {
    server upstream:8080;
}

server {
    listen 80;
    server_name _;

    location = /_health {
        access_log off;

        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_auth {
        internal;

        rewrite ^ /auth/nginx?$auth_request_args break;

        proxy_pass http://authenticator_backend;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Auth-Claim-Expression $http_x_auth_claim_expression;
    }

    location / {
        set $auth_request_args $args;

        auth_request /_auth;

        auth_request_set $auth_subject $upstream_http_x_auth_subject;
        auth_request_set $auth_username $upstream_http_x_auth_username;
        auth_request_set $auth_email $upstream_http_x_auth_email;

        proxy_set_header X-Auth-Subject $auth_subject;
        proxy_set_header X-Auth-Username $auth_username;
        proxy_set_header X-Auth-Email $auth_email;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-Claim-Expression "";

        proxy_pass http://protected_backend;
    }
}
