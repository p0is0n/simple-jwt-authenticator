name: Deploy

run-name: >
  Deploy
  ${{ github.event_name == 'workflow_dispatch' && '(manual build)' || github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  GHCR_SERVER_IMAGE: ghcr.io/${{ github.repository }}
  GHCR_CLI_IMAGE: ghcr.io/${{ github.repository }}-cli

jobs:
  deploy:
    name: Build / Publish
    if: >
      github.event_name == 'workflow_dispatch'
      ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.repository.fork == false
      )

    runs-on: ubuntu-latest

    steps:
      - name: Resolve build context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "ref_name=${DISPATCH_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "sha=${DISPATCH_SHA}" >> "${GITHUB_OUTPUT}"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "ref_name=${WORKFLOW_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha=${WORKFLOW_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.context.outputs.sha }}
          fetch-depth: 0

      - name: Resolve publication
        id: publication
        shell: bash
        env:
          REF_NAME: ${{ steps.context.outputs.ref_name }}
          HEAD_SHA: ${{ steps.context.outputs.sha }}
          PUBLISH: ${{ steps.context.outputs.publish }}
        run: |
          set -euo pipefail

          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "release=false" >> "${GITHUB_OUTPUT}"
          echo "main=false" >> "${GITHUB_OUTPUT}"

          if [[ "${PUBLISH}" != "true" ]]; then
            exit 0
          fi

          if [[ "${REF_NAME}" == "main" ]]; then
            echo "main=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "${REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          tag_sha="$(
            git rev-list -n 1 "refs/tags/${REF_NAME}" 2>/dev/null || true
          )"

          if [[ -z "${tag_sha}" || "${tag_sha}" != "${HEAD_SHA}" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A release tag must reference a commit that is already part of the
          # main branch history. This prevents publishing releases from
          # arbitrary or unreviewed commits outside the protected release line.
          git fetch \
            --no-tags \
            origin \
            "refs/heads/main:refs/remotes/origin/main"

          if ! git merge-base \
            --is-ancestor \
            "${HEAD_SHA}" \
            "refs/remotes/origin/main"; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release=true" >> "${GITHUB_OUTPUT}"
          echo "version=${REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Resolve build metadata
        id: build
        shell: bash
        env:
          RELEASE: ${{ steps.publication.outputs.release }}
          RELEASE_VERSION: ${{ steps.publication.outputs.version }}
          HEAD_SHA: ${{ steps.context.outputs.sha }}
        run: |
          set -euo pipefail

          version="dev"

          if [[ "${RELEASE}" == "true" ]]; then
            version="${RELEASE_VERSION}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract server metadata
        if: steps.publication.outputs.publish == 'true'
        id: server_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_SERVER_IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ steps.publication.outputs.main == 'true' }}
            type=raw,value=${{ steps.publication.outputs.version }},enable=${{ steps.publication.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.publication.outputs.release == 'true' }}

      - name: Extract CLI metadata
        if: steps.publication.outputs.publish == 'true'
        id: cli_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_CLI_IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ steps.publication.outputs.main == 'true' }}
            type=raw,value=${{ steps.publication.outputs.version }},enable=${{ steps.publication.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.publication.outputs.release == 'true' }}

      - name: Login to GitHub Container Registry
        if: steps.publication.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: |
            linux/amd64
            linux/arm64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: ${{ steps.publication.outputs.publish == 'true' && steps.server_meta.outputs.tags || '' }}
          labels: ${{ steps.publication.outputs.publish == 'true' && steps.server_meta.outputs.labels || '' }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build & Push CLI
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cli
          platforms: |
            linux/amd64
            linux/arm64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: ${{ steps.publication.outputs.publish == 'true' && steps.cli_meta.outputs.tags || '' }}
          labels: ${{ steps.publication.outputs.publish == 'true' && steps.cli_meta.outputs.labels || '' }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
