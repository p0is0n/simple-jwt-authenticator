version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

  settings:
    gosec:
      excludes:
        - G101
        - G304
        - G124

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

      - path: tests/integration
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - simple-jwt-authenticator

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
