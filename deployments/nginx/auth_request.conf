# Nginx auth_request deployment example for simple-jwt-authenticator.
#
# This example protects an upstream service using Nginx auth_request, with
# identity headers propagated to the protected upstream via auth_request_set.
#
# It also demonstrates a trusted claim expression owned by Nginx. The
# protected route defines the authorization policy, while the client only
# supplies its credential.
#
# See README.md and AGENTS.md for details.

# The authenticator service. In production, run it behind the same private
# network and use HTTPS on untrusted networks.
upstream authenticator {
    server 127.0.0.1:8080;
}

# The protected upstream. Replace with your real service.
upstream protected_upstream {
    server 127.0.0.1:9000;
}

server {
    listen 443 ssl http2;
    server_name auth.example.com;

    # HTTPS guidance: configure TLS with your certificate chain.
    # ssl_certificate     /etc/nginx/ssl/server.crt;
    # ssl_certificate_key /etc/nginx/ssl/server.key;

    # Internal auth subrequest. Nginx sends the original Authorization header
    # and Cookie so the authenticator can extract the credential.
    #
    # X-Auth-Claim-Expression is supplied by Nginx rather than copied from the
    # client. This makes the expression a trusted route policy that the client
    # cannot remove, replace, or weaken.
    location = /_auth {
        internal;

        proxy_pass http://authenticator/auth/nginx;

        # Do not forward the protected request body to the auth subrequest.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header X-Auth-Claim-Expression $auth_claim_expression;
        proxy_set_header Host $host;
    }

    location / {
        # Require the authenticated token to satisfy this route-specific
        # policy in addition to the JWT validation configured by the
        # authenticator.
        #
        # Supported examples include:
        #
        #   subject == "camera-front"
        #   subject ~= "^camera-[a-z]+$"
        #   subject == "camera-front" && audience == "frigate"
        #   subject == "camera-front" || subject == "camera-back"
        #
        # Parentheses may be used to group logical expressions.
        set $auth_claim_expression 'subject == "camera-front"';

        auth_request /_auth;

        # Capture identity headers from the auth subrequest response.
        auth_request_set $auth_subject  $upstream_http_x_auth_subject;
        auth_request_set $auth_username $upstream_http_x_auth_username;
        auth_request_set $auth_email    $upstream_http_x_auth_email;

        # Forward identity to the protected upstream.
        proxy_set_header X-Auth-Subject  $auth_subject;
        proxy_set_header X-Auth-Username $auth_username;
        proxy_set_header X-Auth-Email    $auth_email;

        proxy_pass http://protected_upstream;
    }
}
